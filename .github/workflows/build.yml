name: APK Derle

# Her push'ta ve manuel tetiklemede çalışır.
# Bir release yayınlandığında APK'yı otomatik olarak ona iliştirir.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

# gh release upload için gerekli; varsayılan token salt okunur.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Model dosyası var mı kontrol et
        run: |
          if [ ! -f app/src/main/assets/nsfw.tflite ]; then
            echo "::warning::assets/nsfw.tflite YOK. APK derlenir ama sınıflandırma çalışmaz."
          else
            echo "Model bulundu: $(du -h app/src/main/assets/nsfw.tflite)"
          fi

      # Keystore secret olarak base64 tutuluyor; dosyaya yalnızca koşu
      # süresince açılıyor ve repoya hiçbir zaman girmiyor.
      - name: İmzalama anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.PERDE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::PERDE_KEYSTORE_BASE64 secret'ı yok. İmzasız release üretilecek, KURULAMAZ."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perde.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK derle
        env:
          PERDE_KEYSTORE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/perde.jks', runner.temp) || '' }}
          PERDE_KEYSTORE_PASSWORD: ${{ secrets.PERDE_KEYSTORE_PASSWORD }}
          PERDE_KEY_ALIAS: ${{ secrets.PERDE_KEY_ALIAS }}
          PERDE_KEY_PASSWORD: ${{ secrets.PERDE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Ad SABİT kalmalı: site indirme bağlantısı
      # releases/latest/download/perde_app.apk adresine bakıyor ve
      # dosya adı değişirse bağlantı 404 verir.
      - name: APK'yı adlandır
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "APK bulunamadı"; exit 1; fi
          cp "$SRC" perde_app.apk
          ls -lh perde_app.apk

      - name: İmza doğrula
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs perde_app.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: perde-apk
          path: perde_app.apk
          retention-days: 30

      # Release yayınlandığında dosyayı otomatik iliştir; böylece adın
      # sabit kalması elle yüklemeye bağlı olmaktan çıkıyor.
      - name: Release'e iliştir
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" perde_app.apk --clobber
